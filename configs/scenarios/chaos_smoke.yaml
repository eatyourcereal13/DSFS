version: 1
name: chaos_smoke
seed: 7
cluster:
  nodes: 5
  raft:
    election_timeout_ms: 150
    heartbeat_interval_ms: 30
network:
  default:
    base_latency_ms: 5
    jitter_ms: 10
    loss_probability: 0.05
    duplicate_probability: 0.02
events:
  - wait_for_leader: {}
  - at_ms: 1000
    set_slow:
      node: 2
      factor: 50.0
  - at_ms: 2000
    crash_node: 5
  - at_ms: 3000
    submit_write:
      key: chaos1
      value: "a"
  - at_ms: 4000
    restart_node: 5
  - at_ms: 5000
    clear_slow:
      node: 2
  - wait_for_leader: {}
  - at_ms: 6000
    submit_write:
      key: chaos2
      value: "b"