version: 1
name: network_partition
seed: 42
cluster:
  nodes: 5
  raft:
    election_timeout_ms: 150
    heartbeat_interval_ms: 30
network:
  default:
    base_latency_ms: 5
    jitter_ms: 2
    loss_probability: 0.0
    duplicate_probability: 0.0
events:
  - wait_for_leader: {}
  - at_ms: 1000
    partition:
      groups: [[1, 2], [3, 4, 5]]
  - at_ms: 5000
    heal:
      groups: [[1, 2], [3, 4, 5]]
  - wait_for_leader: {}
  - at_ms: 6000
    submit_write:
      key: partition_test
      value: "ok"