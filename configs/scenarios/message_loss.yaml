version: 1
name: message_loss
seed: 42
cluster:
  nodes: 5
  raft:
    election_timeout_ms: 150
    heartbeat_interval_ms: 30
network:
  default:
    base_latency_ms: 5
    jitter_ms: 2
    loss_probability: 0.15
    duplicate_probability: 0.0
events:
  - wait_for_leader: {}
  - at_ms: 1000
    submit_write:
      key: lossy
      value: "1"
  - at_ms: 2000
    submit_write:
      key: lossy
      value: "2"
  - at_ms: 3000
    submit_write:
      key: lossy
      value: "3"