[workspace]
resolver = "2"
members = [
    "crates/dsfs-core",
    "crates/dsfs-raft",
    "crates/dsfs-checker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/dsfs"
authors = ["DSFS Authors"]

[workspace.dependencies]
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dsfs-raft = { path = "crates/dsfs-raft" }
dsfs-checker = { path = "crates/dsfs-checker" }
dsfs-core = { path = "crates/dsfs-core" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1